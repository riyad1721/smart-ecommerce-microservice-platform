apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-product
  labels:
    app.kubernetes.io/name: product
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.product.service.type }}
  ports:
    - name: http
      port: {{ .Values.product.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: product
    app.kubernetes.io/instance: {{ .Release.Name }}
