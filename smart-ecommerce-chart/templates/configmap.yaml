apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmqHost | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmqPort | quote }}
  RABBITMQ_USER: {{ .Values.config.rabbitmqUser | quote }}
  APP_ENV: {{ .Values.global.environment | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  API_V1_PREFIX: {{ .Values.config.apiV1Prefix | quote }}
  JWT_ALGORITHM: {{ .Values.global.jwtAlgorithm | quote }}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.jwtAccessTokenExpireMinutes | quote }}
  RABBITMQ_EXCHANGE: {{ .Values.global.rabbitmqExchange | quote }}
  ORDER_CREATED_ROUTING_KEY: {{ .Values.config.orderCreatedRoutingKey | quote }}
  PAYMENT_COMPLETED_ROUTING_KEY: {{ .Values.config.paymentCompletedRoutingKey | quote }}
  PAYMENT_FAILED_ROUTING_KEY: {{ .Values.config.paymentFailedRoutingKey | quote }}
  ORDER_CREATED_QUEUE: {{ .Values.config.paymentOrderCreatedQueue | quote }}
  RABBITMQ_QUEUE: {{ .Values.config.notificationQueue | quote }}
  ENABLE_RABBITMQ_CONSUMER: {{ .Values.config.enableRabbitmqConsumer | quote }}
  RABBITMQ_ENABLED: {{ .Values.config.rabbitmqEnabled | quote }}
  PRODUCT_SERVICE_BASE_URL: "http://{{ .Release.Name }}-product:{{ .Values.product.service.port }}"
