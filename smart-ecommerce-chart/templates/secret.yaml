{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  DATABASE_URL: {{ default .Values.global.databaseUrl .Values.secrets.databaseUrl | quote }}
  RABBITMQ_URL: {{ default .Values.global.rabbitmqUrl .Values.secrets.rabbitmqUrl | quote }}
{{- end }}
