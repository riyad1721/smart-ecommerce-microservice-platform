{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-auth
                port:
                  number: {{ .Values.auth.service.port }}
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-product
                port:
                  number: {{ .Values.product.service.port }}
          - path: /api/v1/categories
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-product
                port:
                  number: {{ .Values.product.service.port }}
          - path: /api/v1/cart
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  number: {{ .Values.order.service.port }}
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  number: {{ .Values.order.service.port }}
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-payment
                port:
                  number: {{ .Values.payment.service.port }}
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-notification
                port:
                  number: {{ .Values.notification.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
